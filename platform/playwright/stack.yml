version: "3.8"

services:
  app:
    image: mcr.microsoft.com/playwright/mcp@sha256:77dccc5ce9e94cb8ae7ebea87ddbb6cd54b05760c4d63c54e16accf2726b8734
    command:
      - --port
      - "8931"
      - --host
      - "0.0.0.0"
      - --isolated
      - --no-webmcp
      - --block-service-workers
      - --codegen
      - none
      - --console-level
      - error
      - --image-responses
      - omit
      - --idle-timeout
      - "300000"
      - --timeout-navigation
      - "30000"
      - --timeout-action
      - "5000"
      - --output-max-size
      - "10485760"
      - --allowed-hosts
      - "playwright-mcp-internal_app,playwright-mcp-internal_app:8931,localhost,127.0.0.1"
      - --allowed-origins
      - "https://app.conexaoazul.com;https://magicachat.conexaoazul.com;https://mcp.conexaoazul.com;https://financeiro-mcp.conexaoazul.com;https://samumais-mcp.conexaoazul.com;https://portal17-mcp.conexaoazul.com"
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == azul2
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
        reservations:
          cpus: "0.10"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback

networks:
  internal:
    external: true
    name: mcp_playwright_internal
