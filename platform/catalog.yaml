version: 1
generated_at: "2026-09-26"
source_of_truth:
  runtime: "Docker Swarm on azul2"
  portal_api: "Cloudflare MCP Server Portals / Agents Gateway"
  repository: "conexaoazul/mcp"
  note: "Conexao Azul portal_list_servers is a client view and may lag the Cloudflare Portal source of truth."

platform:
  canonical_public_base: "https://mcp.conexaoazul.com"
  canonical_path_pattern: "/mcp/{server_id}"
  origin_public_base: "https://mcp-origin.conexaoazul.com"
  architecture_note: "mcp.conexaoazul.com is the Cloudflare MCP Portal/Agents Gateway; mcp-origin.conexaoazul.com is the raw tunnel origin."
  default_exposure: "overlay-only"
  ingress_policy: "Cloudflare Access/OAuth -> gateway -> MCP upstream"
  secrets_policy: "Docker Secret or OCI Vault; never inline service args/env"
  readiness_gate:
    - "transport reachable"
    - "MCP protocol negotiation"
    - "server identity matches expected server"
    - "tools/list succeeds"
    - "tool schema lint succeeds or has documented exception"
    - "read-only canary succeeds where applicable"

portals:
  - id: conexao-azul-odoo
    name: "Conexao Azul CRM MCP"
    hostname: "mcp.conexaoazul.com"
    state: active
    servers:
      - {id: context7, tools: 2}
      - {id: uptime-kuma, tools: 31}
      - {id: odoo-consultas, tools: 11}
      - {id: n8n, tools: 33}
      - {id: chatwoot, tools: 123}
      - {id: portainer, tools: 119}
      - {id: postiz, tools: 11}

  - id: financeiro
    name: "Conexao Azul Financeiro"
    hostname: "financeiro-mcp.conexaoazul.com"
    state: active
    servers:
      - {id: banco-inter, tools: 6}
      - {id: asaas-principal, tools: 24}
      - {id: odoo-consultas, tools: 11}
      - {id: asaas-sandbox, tools: 24}
      - {id: asaas-docs, tools: 7}
      - {id: asaas-blueconnect, tools: 24}

  - id: samu-mais-ai
    name: "SAMU MAIS AI"
    hostname: "samumais-mcp.conexaoazul.com"
    state: active
    servers:
      - {id: samumais-replica, tools: 25}
      - {id: samu-gestao, tools: 7}
      - {id: samu-coordenacao, tools: 8}
      - {id: samu-medico, tools: 7}
      - {id: samu-ti, tools: 5}
      - {id: samu-diretoria, tools: 8}
      - {id: contaazul-imtech-savvis, tools: 7}

  - id: portal17
    name: "Portal17 (Odoo 17)"
    hostname: "portal17-mcp.conexaoazul.com"
    state: active
    servers:
      - {id: portal17, tools: 8}

servers:
  - id: chatwoot
    name: "Chatwoot / MagicaChat"
    state: active
    portal_enabled: true
    portal_tool_count: 123
    swarm_service: chatwoot-mcp
    image: "ca/chatwoot-mcp-bridge:1.0"
    bridge_path: "/chatwoot/mcp"
    transport: streamable-http
    exposure:
      - type: public
        url: "https://mcp-origin.conexaoazul.com/chatwoot/mcp"
        auth: protected
        last_probe: "Cloudflare Access HTTP 302 before auth"
        router: "chatwootmcp-native"
        path_preservation_fix: "applied 2026-09-26"
        protocol_smoke: "PASS: 123 tools; 0 schema errors; 17 warnings"
      - type: host
        published_port: 18102
        target_port: 8102

  - id: context7
    name: "Context7 IA Docs"
    state: active
    portal_enabled: true
    exposure:
      - type: portal
        route: "context7"

  - id: n8n
    name: "n8n Automacoes"
    state: active
    portal_enabled: true
    exposure:
      - type: portal
        route: "n8n"

  - id: odoo-consultas
    name: "Odoo Consultas Comercial"
    state: active
    portal_enabled: true
    exposure:
      - type: portal
        route: "odoo-consultas"
    related_runtime:
      bridge: dr-mcp-odoo-bridge
      gateway: dr-mcp-odoo-gateway
      bridge_image: "ca/mcp-odoo:0.8.0-dr-20260919"
      transport: streamable-http
      internal_upstream: "http://dr-mcp-odoo-bridge:8000"
      host_gateway_port: 18081

  - id: portainer
    name: "Portainer Swarm"
    state: active
    portal_enabled: true
    swarm_service: portainer-mcp
    image: "ca/portainer-mcp-bridge:1.3-stateful-20260923"
    bridge_path: "/portainer/mcp"
    transport: streamable-http-stateful
    exposure:
      - type: public
        url: "https://mcp-origin.conexaoazul.com/portainer/mcp"
        auth: protected
        last_probe: "Cloudflare Access HTTP 302 before auth"
        router: "portainermcp-native"
        path_preservation_fix: "applied 2026-09-26"
        protocol_smoke: "PASS: 119 tools; 0 schema errors; 2 warnings"
      - type: host
        published_port: 18101
        target_port: 8100

  - id: uptime-kuma
    name: "Uptime Kuma"
    state: active
