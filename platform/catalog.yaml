    image: "davidfuchs/mcp-uptime-kuma@sha256:1b0b0f13b21487e68c9798a29e035cc4afe1d7db284f70966d88a7fbd9e29028"
    transport: streamable-http
    internal_port: 3000
    exposure:
      - type: portal
        route: "uptime-kuma"

  - id: blue-odoo-ops
    name: "Blue Odoo Ops"
    state: active
    portal_enabled: false
    runtime:
      edge_service: blue-odoo-ops_edge
      gateway_service: blue-odoo-ops_gateway
      edge_image: "ca/blue-odoo-mcp-edge:20260926-ops-canary"
      gateway_image: "ca/mcp-odoo-gateway:1.1-audmulti-20260923"
      internal_upstream: "http://edge:8000"
    exposure:
      - type: overlay
        note: "Operational Odoo/shell MCP path; keep separated from commercial Odoo MCP."

  - id: apify
    name: "Apify MCP"
    state: active-origin-auth-gated-not-in-portal
    portal_enabled: false
    runtime:
      auth_service: apify-mcp-auth
      discovery_service: apify-mcp-discovery
      gateway_image: "ca/mcp-odoo-gateway:dr-20260919"
      bridge_image: "ca/apify-mcp-bridge:20260920"
      internal_upstream: "http://apify-mcp-discovery:8110"
    exposure:
      - type: configured-public
        url: "https://mcp.conexaoazul.com/apify/mcp"
        last_probe: "legacy canonical-path probe was invalid: canonical host is Portal, not raw origin"
        desired: "MCP protocol response behind Access"
      - type: host
        published_port: 18110
        target_port: 8080

  - id: cloudflare-official
    name: "Cloudflare Official MCP"
    state: active-origin-green-not-in-portal
    portal_enabled: false
    swarm_service: cloudflare-official_official
    image: "ca/cloudflare-official-mcp:20260920"
    upstream: "https://mcp.cloudflare.com/mcp"
    protocol_smoke: "PASS on local bridge: tools/list HTTP 200"
    exposure:
      - type: configured-public
        url: "https://mcp.conexaoazul.com/cloudflare/mcp"
        last_probe: "HTTP 404"
      - type: host
        published_port: 18121
        target_port: 8121

  - id: cloudflare-legacy-bridge
    name: "Cloudflare Legacy Bridge"
    state: active
    portal_enabled: false
    swarm_service: cloudflare-mcp_cloudflare-mcp
    image: "ca/cloudflare-mcp-bridge:20260920"
    exposure:
      - type: host
        published_port: 18120
        target_port: 8120
    lifecycle: "candidate-for-retirement-after-official-path-is-green"

  - id: transcription
    name: "Blue Transcription MCP"
    state: active
    portal_enabled: false
    swarm_service: transcription_mcp
    image: "ghcr.io/conexaoazul/blue-transcription-mcp:1e9d523@sha256:538b6073a3e08825d4c8eaaec6886bcd196d29777eb6ef842fb23b8b6f15f5c6"
    transport: streamable-http
    mcp_path: "/mcp"
    health_path: "/healthz"
    internal_port: 8083
    exposure:
      - type: host
        published_port: 18083
        target_port: 8083

  - id: portal17-toolbox
    name: "Portal17 Database Toolbox"
    state: active
    portal_enabled: false
    runtime:
      toolbox_service: portal17-mcp-toolbox
      gateway_service: portal17-mcp-gateway
      toolbox_image: "us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest@sha256:fbb9609b4d738f684795c0d57b341c1a34c8251246c590e6fd2526ffa9fb4fa7"
      internal_upstream: "http://portal17-mcp-toolbox:5111"
    exposure:
      - type: overlay

code_ready:
  - id: blue-database-mcp
    repo: "https://github.com/conexaoazul/blue-database-mcp"
    state: poc-ready
    focus: "secure multi-engine DB MCP + SAMU"
    engines:
      - "conexaoazul/mariadb-mcp"
      - "conexaoazul/dbhub"
      - "conexaoazul/mcp-toolbox"

  - id: samu-mcp-toolbox
    state: config-ready
    runtime_path: "/home/devops/work/samu-mcp"
    source: "samu-replica"
    policy: "read-only reporting views"

  - id: asaas-mcp
    state: active-in-financeiro-portal
    runtime_path: "/home/devops/asaas-mcp"
    portal_servers:
      - asaas-principal
      - asaas-sandbox
      - asaas-blueconnect
      - asaas-docs
    recommended_policy: "keep writes behind portal OAuth and approval gates"

  - id: inter-mcp
    state: active-in-financeiro-portal
    runtime_path: "/home/devops/inter-mcp"
    portal_server: banco-inter
    recommended_policy: "keep read-only; migrate certificate/private key material from host files into Docker Secrets"

  - id: dhy-business-mcp
    state: scaled-to-zero
    swarm_service: dhy-business_business-mcp
    image: "dhy/business-mcp:local"

  - id: blueapps19-native
    state: code-available
    modules:
      - blue_mcp_server
      - blue_mcp_governance
      - blue_mcp_finops
      - blue_mcp_finops_inter
      - blue_mcp_mass_support
      - blue_mcp_tech_expert

activation_backlog:
  - id: cloudflare-official
    priority: P0
    readiness: "raw origin https://mcp-origin.conexaoazul.com/cloudflare/mcp returns valid tools/list"
    tool_surface: 3
    tools: [docs, search, execute]
    guardrail: "do not add to broad portal until execute/write authority is constrained or Access policy is explicitly approved"

  - id: apify
    priority: P1
    readiness: "raw origin route healthy; bearer gate returns 401 as expected"
    guardrail: "verify Portal auth credentials and least-privilege before sync"

  - id: blue-odoo-ops
    priority: P1
    readiness: "edge + gateway are active on overlay"
    guardrail: "add dedicated origin route/auth before portal publication"

  - id: transcription
    priority: P1
    readiness: "MCP service active; health green"
    guardrail: "add origin route + bearer/Access policy before portal publication"

