name: MCP Platform CI

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/mcp-platform-ci.yml"
  push:
    paths:
      - "platform/**"
      - ".github/workflows/mcp-platform-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse catalog YAML
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML
          python - <<'PY'
          import pathlib, yaml
          p = pathlib.Path("platform/catalog.yaml")
          doc = yaml.safe_load(p.read_text())
          assert doc["version"] == 1
          assert doc["portals"]
          assert doc["servers"]
          print("catalog ok")
          PY

      - name: Syntax-check shell scripts
        run: |
          set -euo pipefail
          for f in platform/*.sh; do
            bash -n "$f"
          done

      - name: Reject sensitive artifacts in platform
        run: |
          set -euo pipefail
          bad="$(git ls-files platform | grep -E '\.(pem|key|p12|pfx|env)$' || true)"
          test -z "$bad" || { echo "Sensitive-looking files tracked:"; echo "$bad"; exit 1; }

      - name: Validate Prometheus safety declaration
        run: |
          python - <<'PY'
          import yaml
          doc = yaml.safe_load(open("platform/catalog.yaml"))
          p = next(s for s in doc["servers"] if s["id"] == "prometheus")
          smoke = p["protocol_smoke"]
          assert smoke["tools"] == 18
          assert smoke["read_only_true"] == 18
          assert smoke["destructive_false"] == 18
          assert smoke["idempotent_true"] == 18
          assert smoke["open_world_false"] == 18
          assert p["main_portal_policy"]["default_disabled"] is True
          assert p["main_portal_policy"]["on_behalf"] is False
          assert p["main_portal_policy"]["allowlisted_tools"] == 11
          print("Prometheus policy ok")
          PY

      - name: Validate Playwright egress boundary
        run: |
          python - <<'PY'
          import pathlib, yaml
          catalog = yaml.safe_load(open("platform/catalog.yaml"))
          p = next(s for s in catalog["servers"] if s["id"] == "playwright")
          assert p["portal_enabled"] is False
          assert p["published_ports"] == 0
          assert p["network_internal"] is True
          assert p["egress_proxy"]["direct_egress"] is False
          assert p["egress_proxy"]["private_ranges_denied"] is True

          stack = yaml.safe_load(open("platform/playwright/stack.yml"))
          app = stack["services"]["app"]
          assert "ports" not in app
          args = app["command"]
          assert "--proxy-server" in args
          assert "http://playwright-egress_proxy:3128" in args
          assert app["networks"] == ["private"]

          squid = pathlib.Path("platform/playwright/squid.conf").read_text()
          for required in [
              "acl private_dst dst 10.0.0.0/8",
              "acl private_dst dst 100.64.0.0/10",
              "acl private_dst dst 169.254.0.0/16",
              "acl private_dst dst 172.16.0.0/12",
              "acl private_dst dst 192.168.0.0/16",
              "http_access deny private_dst",
              "http_access deny all",
          ]:
              assert required in squid, required
          print("Playwright egress policy ok")
          PY

      - name: Validate Terraform Registry boundary
        run: |
          python - <<'PY'
          import pathlib, yaml
          catalog = yaml.safe_load(open("platform/catalog.yaml"))
          t = next(s for s in catalog["servers"] if s["id"] == "terraform-registry")
          assert t["portal_enabled"] is False
          assert t["published_ports"] == 0
          assert t["network_internal"] is True
          assert t["runtime_policy"]["toolsets"] == ["registry"]
          assert t["runtime_policy"]["enable_tf_operations"] is False
          assert t["runtime_policy"]["hcp_tfe_tools"] is False
          assert t["credentials"]["tfe_token"] == "absent"
          assert t["credentials"]["tfe_address"] == "absent"
          assert t["egress_proxy"]["direct_egress"] is False
          assert t["egress_proxy"]["allowed_domains"] == ["registry.terraform.io"]
          assert t["tool_surface"]["total"] == 9

          stack = yaml.safe_load(open("platform/terraform/stack.yml"))
          app = stack["services"]["app"]
          assert "ports" not in app
          args = app["command"]
          assert "--toolsets" in args
          assert "registry" in args
          env = app.get("environment", {})
          assert env.get("ENABLE_TF_OPERATIONS") == "false"
          assert "TFE_TOKEN" not in env
          assert "TFE_ADDRESS" not in env

          squid = pathlib.Path("platform/terraform/squid.conf").read_text()
          for required in [
              "acl allowed_registry dstdomain registry.terraform.io",
              "acl private_dst dst 10.0.0.0/8",
              "acl private_dst dst 100.64.0.0/10",
              "acl private_dst dst 169.254.0.0/16",
              "acl private_dst dst 172.16.0.0/12",
              "acl private_dst dst 192.168.0.0/16",
              "http_access deny private_dst",
              "http_access deny all",
          ]:
              assert required in squid, required
          print("Terraform Registry boundary ok")
          PY
